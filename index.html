<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation1 - Microsoft PowerPoint 365</title>
    <!-- Favicon chữ P chuẩn PowerPoint -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%23c43e1c%22/><text x=%2250%22 y=%2270%22 font-size=%2265%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22Arial, sans-serif%22>P</text></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        office: {
                            red: '#c43e1c',
                            darkred: '#b7371a',
                            topred: '#d03b1e',
                            bg: '#adbdcc',
                            ribbon: '#f3f3f3',
                            border: '#d4d4d4'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .slide-canvas {
            width: 860px;
            height: 484px;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .slide-thumb {
            width: 130px;
            height: 73px;
            background: white;
            border: 1px solid #c8c8c8;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
        }
        .slide-thumb.active {
            border: 2px solid #e9a332;
            box-shadow: 0 0 6px rgba(233, 163, 50, 0.6);
        }

        /* Hộp văn bản desktop */
        .ppt-box {
            position: absolute;
            border: 1px dashed #94a3b8;
            box-sizing: border-box;
            background: transparent;
            min-width: 180px;
            border-radius: 3px;
        }
        .ppt-box:hover, .ppt-box.selected {
            border: 1.5px solid #c43e1c;
        }

        /* Thanh tay cầm kéo di chuyển */
        .drag-handle {
            height: 18px;
            background: #c43e1c;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            color: white;
            font-size: 9px;
            opacity: 0.2;
            transition: opacity 0.2s;
            border-top-left-radius: 2px;
            border-top-right-radius: 2px;
        }
        .ppt-box:hover .drag-handle, .ppt-box.selected .drag-handle {
            opacity: 1;
        }

        /* Vùng nội dung gõ chữ độc lập */
        .box-content {
            padding: 6px;
            width: 100%;
            height: calc(100% - 18px);
            outline: none;
            cursor: text;
        }

        /* TRANSITIONS & FLIP ANIMATION */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pushIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes zoomIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes flip3DIn {
            from { transform: perspective(1000px) rotateY(-90deg); opacity: 0; }
            to { transform: perspective(1000px) rotateY(0deg); opacity: 1; }
        }

        .anim-fade { animation: fadeIn 0.4s ease-in-out; }
        .anim-push { animation: pushIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .anim-zoom { animation: zoomIn 0.35s ease-out; }
        .anim-flip { animation: flip3DIn 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 h-screen flex flex-col overflow-hidden font-sans select-none text-xs">

    <!-- TOP RED BANNER (TITLE BAR) -->
    <header class="bg-office-topred text-white h-8 flex items-center justify-between px-2 text-xs z-30 shadow-sm">

            <div class="w-5 h-5 bg-office-darkred rounded flex items-center justify-center font-bold text-white text-xs border border-white/25">P</div>
            <button onclick="saveToFileComputer()" class="px-2 py-0.5 bg-office-darkred hover:bg-red-800 rounded font-bold text-white flex items-center gap-1 border border-white/20" title="Tải về tệp máy tính"><i class="fas fa-download"></i> Lưu về máy</button>
            <button onclick="startSlideShow()" class="p-1 hover:bg-office-darkred rounded" title="Trình chiếu (F5)"><i class="fas fa-play"></i></button>
            <button onclick="resetDataForce()" class="px-2 py-0.5 bg-red-700 hover:bg-red-800 rounded font-bold text-white ml-2 flex items-center gap-1" title="Khôi phục cài đặt gốc"><i class="fas fa-rotate"></i> Reset</button>

    <!-- RIBBON NAVIGATION TABS -->

    <!-- RIBBON TOOLBAR PANEL (MÔ PHỎNG CHUẨN GIAO DIỆN POWERPOINT 2010-2016) -->

    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        function createInitialSlides() {
            return [
                {
                    id: 1,
                    bgColor: '#ffffff',
                    transition: 'flip',
                    elements: [
                        { id: 'title-1', left: 130, top: 100, width: 600, bgColor: 'transparent', content: '<div class="font-semibold text-4xl text-center text-black">Nhấp để thêm tiêu đề</div>' },
                        { id: 'subtitle-1', left: 180, top: 220, width: 500, bgColor: 'transparent', content: '<div class="font-normal text-xl text-center text-gray-500">Nhấp để thêm nội dung</div>' }
                    ]
                }
            ];
        }

        let currentUser = null;
        let currentAuthMode = 'login';
        let slides = createInitialSlides();
        let currentSlideIndex = 0;
        let activeDrag = null;
        let selectedElementIndex = null;
        let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

        function getStorageKey() {
            return currentUser ? `ppt_user_${currentUser.email}` : 'ppt_guest_data';
        }

        function initApp() {
            try {
                const savedUser = localStorage.getItem('ppt_active_user');
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                    updateUserUI();
                }
                const savedData = localStorage.getItem(getStorageKey());
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    if (Array.isArray(parsed) && parsed.length > 0) slides = parsed;
                }
            } catch(e) {
                slides = createInitialSlides();
            }

            renderThumbnails();
            renderCanvas();

            window.addEventListener('mousemove', (e) => {
                if (!activeDrag) return;
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;

                let canvas = document.getElementById('slideCanvas');
                let newLeft = Math.max(0, Math.min(canvas.clientWidth - 50, initialLeft + dx));
                let newTop = Math.max(0, Math.min(canvas.clientHeight - 30, initialTop + dy));

                activeDrag.element.style.left = newLeft + 'px';
                activeDrag.element.style.top = newTop + 'px';
                activeDrag.item.left = newLeft;
                activeDrag.item.top = newTop;
            });

            window.addEventListener('mouseup', () => {
                if (activeDrag) {
                    activeDrag = null;
                    savePresentation();
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'F5') { e.preventDefault(); startSlideShow(); }
                else if (e.key === 'Escape') { stopSlideShow(); }
            });
        }

        window.onload = initApp;

        // CHÈN HÌNH ẢNH TỪ TỆP MÁY TÍNH
        function triggerImageUpload() {
            document.getElementById('imageFileInput').click();
        }

        function handleImageFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                slides[currentSlideIndex].elements.push({
                    id: 'el-' + Date.now(),
                    left: 200,
                    top: 100,
                    bgColor: 'transparent',
                    content: `<img src="${imageUrl}" class="max-w-[450px] max-h-[300px] rounded shadow border pointer-events-none object-contain">`
                });
                renderCanvas();
                savePresentation();
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        // SAVE & LOAD TO/FROM COMPUTER FILE
        function saveToFileComputer() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(slides, null, 2));
            const downloadAnchor = document.createElement('a');
            const fileName = (document.getElementById('docTitleDisplay').innerText || 'Presentation1').replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.ppt';
            
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            alert(`Đã tải tệp bài thuyết trình "${fileName}" về máy tính thành công!`);
        }

        function triggerOpenFileComputer() {
            document.getElementById('fileComputerInput').click();
        }

        function loadFromFileComputer(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loadedSlides = JSON.parse(e.target.result);
                    if (Array.isArray(loadedSlides) && loadedSlides.length > 0) {
                        slides = loadedSlides;
                        currentSlideIndex = 0;
                        renderThumbnails();
                        renderCanvas();
                        savePresentation();
                        alert('Đã mở tệp từ máy tính thành công!');
                    } else {
                        alert('Định dạng tệp không hợp lệ!');
                    }
                } catch (err) {
                    alert('Lỗi khi đọc tệp từ máy tính!');
                }
            };
            reader.readAsText(file);
        }

        // FILE MENU MODAL
        function openFileMenuModal() { document.getElementById('fileMenuModal').classList.remove('hidden'); }
        function closeFileMenuModal() { document.getElementById('fileMenuModal').classList.add('hidden'); }

        // RESET FUNCTION
        function resetDataForce() {
            if (confirm('Bạn có chắc chắn muốn khôi phục cài đặt gốc và làm mới toàn bộ bài thuyết trình?')) {
                localStorage.removeItem(getStorageKey());
                slides = createInitialSlides();
                currentSlideIndex = 0;
                renderThumbnails();
                renderCanvas();
                alert('Đã khôi phục cài đặt gốc thành công!');
            }
        }

        // AUTHENTICATION
        function openAuthModal(mode = 'login') {
            switchAuthTab(mode);
            document.getElementById('authModal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
        }

        function switchAuthTab(mode) {
            currentAuthMode = mode;
            const tabLogin = document.getElementById('tabLoginBtn');
            const tabReg = document.getElementById('tabRegisterBtn');
            const nameGrp = document.getElementById('fullNameGroup');
            const submitBtn = document.getElementById('authSubmitBtn');

            if (mode === 'login') {
                tabLogin.className = "font-bold text-sm text-office-red border-b-2 border-office-red pb-1";
                tabReg.className = "font-semibold text-sm text-slate-500 hover:text-office-red pb-1";
                nameGrp.classList.add('hidden');
                submitBtn.innerText = "Đăng nhập";
            } else {
                tabReg.className = "font-bold text-sm text-office-red border-b-2 border-office-red pb-1";
                tabLogin.className = "font-semibold text-sm text-slate-500 hover:text-office-red pb-1";
                nameGrp.classList.remove('hidden');
                submitBtn.innerText = "Tạo tài khoản Đăng ký";
            }
        }

        function handleAuthSubmit() {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const fullName = document.getElementById('regFullName').value.trim();

            if (!email || !pass) return alert('Vui lòng nhập Email và Mật khẩu!');

            if (currentAuthMode === 'register') {
                if (!fullName) return alert('Vui lòng nhập Họ và tên!');
                const userObj = { name: fullName, email: email, pass: pass };
                localStorage.setItem(`ppt_reg_${email}`, JSON.stringify(userObj));
                currentUser = userObj;
                alert(`Đăng ký tài khoản thành công! Xin chào ${fullName}`);
            } else {
                const registered = localStorage.getItem(`ppt_reg_${email}`);
                if (registered) currentUser = JSON.parse(registered);
                else currentUser = { name: email.split('@')[0], email: email };
                alert(`Đăng nhập thành công!`);
            }

            localStorage.setItem('ppt_active_user', JSON.stringify(currentUser));
            updateUserUI();
            closeAuthModal();
            initApp();
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('ppt_active_user');
            updateUserUI();
            initApp();
            alert('Đã đăng xuất tài khoản!');
        }

        function updateUserUI() {
            const guestGrp = document.getElementById('guestAuthGroup');
            const userGrp = document.getElementById('userProfileGroup');
            const nameTxt = document.getElementById('userNameText');

            if (currentUser) {
                guestGrp.classList.add('hidden');
                userGrp.classList.remove('hidden');
                nameTxt.innerText = currentUser.name || currentUser.email.split('@')[0];
            } else {
                guestGrp.classList.remove('hidden');
                userGrp.classList.add('hidden');
            }
        }

        // SLIDE ENGINE
        function renderThumbnails() {
            const list = document.getElementById('slideThumbnailList');
            if (!list) return;
            list.innerHTML = '';

            slides.forEach((slide, idx) => {
                const thumb = document.createElement('div');
                thumb.className = `slide-thumb flex flex-col justify-between p-1 text-[10px] ${idx === currentSlideIndex ? 'active' : ''}`;
                thumb.onclick = () => { currentSlideIndex = idx; renderThumbnails(); renderCanvas(); };
                
                thumb.innerHTML = `
                    <div class="font-bold text-slate-500">${idx + 1}</div>
                    <div class="text-center font-medium truncate text-slate-700">Slide ${idx + 1}</div>
                `;
                list.appendChild(thumb);
            });

            document.getElementById('currentSlideStatus').innerText = `Slide ${currentSlideIndex + 1} of ${slides.length}`;
        }

        function renderCanvas() {
            const canvas = document.getElementById('slideCanvas');
            if (!canvas) return;

            if (!slides[currentSlideIndex]) currentSlideIndex = 0;
            const slide = slides[currentSlideIndex];

            canvas.style.backgroundColor = slide.bgColor || '#ffffff';
            canvas.innerHTML = '';

            slide.elements.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = 'ppt-box';
                box.style.left = item.left + 'px';
                box.style.top = item.top + 'px';
                box.style.backgroundColor = item.bgColor || 'transparent';
                if (item.width) box.style.width = item.width + 'px';

                box.onclick = () => {
                    selectedElementIndex = index;
                    document.querySelectorAll('.ppt-box').forEach(b => b.classList.remove('selected'));
                    box.classList.add('selected');
                    if (item.bgColor && item.bgColor !== 'transparent') {
                        document.getElementById('boxBgColorPicker').value = item.bgColor;
                    }
                };

                const handle = document.createElement('div');
                handle.className = 'drag-handle';
                handle.innerHTML = `<span><i class="fas fa-arrows-up-down-left-right"></i> Di chuyển</span><span>✕</span>`;

                handle.onmousedown = (e) => {
                    e.stopPropagation();
                    activeDrag = { item, element: box };
                    startX = e.clientX;
                    startY = e.clientY;
                    initialLeft = item.left;
                    initialTop = item.top;
                };

                const content = document.createElement('div');
                content.className = 'box-content';
                content.innerHTML = item.content;

                const editableEl = content.firstElementChild || content;
                editableEl.setAttribute('contenteditable', 'true');

                editableEl.oninput = () => {
                    item.content = content.innerHTML;
                    savePresentation();
                };

                box.appendChild(handle);
                box.appendChild(content);
                canvas.appendChild(box);
            });
        }

        function changeSelectedBoxBg(color) {
            if (selectedElementIndex !== null && slides[currentSlideIndex].elements[selectedElementIndex]) {
                slides[currentSlideIndex].elements[selectedElementIndex].bgColor = color;
                renderCanvas();
                savePresentation();
            } else {
                alert('Vui lòng nhấp chọn một Hộp văn bản trên slide trước khi đổi màu nền!');
            }
        }

        function addNewSlide() {
            slides.push({
                id: Date.now(),
                bgColor: '#ffffff',
                transition: 'flip',
                elements: [
                    { id: 'el-' + Date.now(), left: 130, top: 100, width: 600, bgColor: 'transparent', content: '<div class="font-semibold text-4xl text-center text-black">Nhấp để thêm tiêu đề</div>' },
                    { id: 'el-' + (Date.now()+1), left: 180, top: 220, width: 500, bgColor: 'transparent', content: '<div class="font-normal text-xl text-center text-gray-500">Nhấp để thêm nội dung</div>' }
                ]
            });
            currentSlideIndex = slides.length - 1;
            renderThumbnails();
            renderCanvas();
            savePresentation();
        }

        function duplicateSlide() {
            const copy = JSON.parse(JSON.stringify(slides[currentSlideIndex]));
            copy.id = Date.now();
            slides.splice(currentSlideIndex + 1, 0, copy);
            currentSlideIndex++;
            renderThumbnails();
            renderCanvas();
            savePresentation();
        }

        function deleteCurrentSlide() {
            if (slides.length <= 1) return alert('Bài trình chiếu phải giữ lại ít nhất 1 Slide!');
            slides.splice(currentSlideIndex, 1);
            currentSlideIndex = Math.max(0, currentSlideIndex - 1);
            renderThumbnails();
            renderCanvas();
            savePresentation();
        }

        function addTextBox() {
            slides[currentSlideIndex].elements.push({
                id: 'el-' + Date.now(),
                left: 250,
                top: 180,
                width: 300,
                bgColor: 'transparent',
                content: '<div class="font-normal text-lg text-black">Nhập văn bản mới...</div>'
            });
            renderCanvas();
            savePresentation();
        }

        function addShape(type) {
            let shapeHtml = type === 'rect' 
                ? '<div class="w-44 h-28 bg-office-red rounded flex items-center justify-center text-white font-bold shadow">Hình chữ nhật</div>'
                : '<div class="w-32 h-32 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold shadow">Hình tròn</div>';

            slides[currentSlideIndex].elements.push({
                id: 'el-' + Date.now(),
                left: 280,
                top: 160,
                bgColor: 'transparent',
                content: shapeHtml
            });
            renderCanvas();
            savePresentation();
        }

        function applyTheme(th) {
            const s = slides[currentSlideIndex];
            if (th === 'white') s.bgColor = '#ffffff';
            else if (th === 'dark') s.bgColor = '#0f172a';
            else if (th === 'blue') s.bgColor = '#1e3a8a';
            renderCanvas();
            savePresentation();
        }

        function setTransition(trans) {
            slides[currentSlideIndex].transition = trans;
            savePresentation();
            alert(`Đã đặt hiệu ứng chuyển trang: ${trans.toUpperCase()}`);
        }

        function execFormat(cmd, val = null) {
            document.execCommand(cmd, false, val);
            savePresentation();
        }

        function startSlideShow() {
            document.getElementById('slideShowOverlay').classList.remove('hidden');
            renderSlideShowContent();
        }

        function renderSlideShowContent() {
            const container = document.getElementById('slideShowContent');
            const slide = slides[currentSlideIndex];
            container.style.backgroundColor = slide.bgColor || '#ffffff';
            container.innerHTML = '';

            const trans = slide.transition || 'fade';
            container.className = "w-full h-full flex flex-col items-center justify-center text-center relative p-12 ";
            if (trans === 'fade') container.classList.add('anim-fade');
            else if (trans === 'push') container.classList.add('anim-push');
            else if (trans === 'zoom') container.classList.add('anim-zoom');
            else if (trans === 'flip') container.classList.add('anim-flip');

            slide.elements.forEach(item => {
                const el = document.createElement('div');
                el.style.position = 'absolute';
                el.style.left = (item.left * 1.1) + 'px';
                el.style.top = (item.top * 1.1) + 'px';
                el.style.backgroundColor = item.bgColor || 'transparent';
                el.innerHTML = item.content;
                el.querySelectorAll('[contenteditable]').forEach(e => e.removeAttribute('contenteditable'));
                container.appendChild(el);
            });
        }

        function nextSlideShow() {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                renderSlideShowContent();
            } else {
                stopSlideShow();
            }
        }

        function stopSlideShow() {
            document.getElementById('slideShowOverlay').classList.add('hidden');
            renderCanvas();
        }

        function switchTab(name) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.ribbon-btn').forEach(b => b.classList.remove('bg-white', 'border-t-2', 'border-office-red'));
            
            const panel = document.getElementById(`panel-${name}`);
            const btn = document.getElementById(`tab-${name}`);
            if (panel) panel.classList.remove('hidden');
            if (btn) btn.classList.add('bg-white', 'border-t-2', 'border-office-red');
        }

        function savePresentation() {
            localStorage.setItem(getStorageKey(), JSON.stringify(slides));
        }

        function renamePresentation() {
            const title = prompt('Nhập tên bài thuyết trình:', 'Presentation1 - Microsoft PowerPoint');
            if (title) document.getElementById('docTitleDisplay').innerText = title;
        }
    </script>
</body>
</html>
